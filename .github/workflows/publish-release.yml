name: Publish VERSION release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - host-webui/VERSION
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release from VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < host-webui/VERSION)
          TAG="v${VER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "V${VER}" --notes "Library Play next on this host and NAS. Tap a track to play now. Play next queues it in Up next for This host and NAS. Live 192.168.1.142. Hard-refresh Library."
